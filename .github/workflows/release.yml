name: Release

# A release is a bare version tag (0.1.1, never v0.1.1: the Obsidian directory
# reads the tag as the version). On that tag this workflow runs the gate on
# the tagged commit, refuses a tag that does not equal manifest.json's
# version, attests the three release assets with GitHub artifact attestations
# and publishes the release with exactly those assets and the notes from
# docs/releases/<version>.md.
#
# The manual `gh release create` stays the fallback. A release cut that way
# says so in its notes, and the two paths never run for the same tag: this
# workflow publishes only when no release for the tag exists yet.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4

      - name: Set up Node from .node-version
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install
        run: npm ci

      - name: The tag is the manifest version
        run: |
          MANIFEST=$(node -p "require('./manifest.json').version")
          if [ "$MANIFEST" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not equal manifest.json version $MANIFEST"
            exit 1
          fi
          test -f "docs/releases/$GITHUB_REF_NAME.md" || { echo "docs/releases/$GITHUB_REF_NAME.md is missing"; exit 1; }

      - name: Gate (typecheck, build, lint, tests, headless Chrome, pty smoke)
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: npm run gate

      - name: Attest main.js, manifest.json and styles.css
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}.md
          fail_on_unmatched_files: true
          files: |
            main.js
            manifest.json
            styles.css
