name: Release

# A release is a bare version tag (0.1.1, never v0.1.1: the Obsidian directory
# reads the tag as the version). On that tag this workflow runs the gate on
# the tagged commit, refuses a tag that does not equal manifest.json's
# version, attests the three release assets with GitHub artifact attestations
# and publishes the release with exactly those assets and the notes from
# docs/releases/<version>.md.
#
# The manual `gh release create` stays the fallback. A release cut that way
# says so in its notes, and the two paths never run for the same tag: this
# workflow publishes only when no release for the tag exists yet.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node from .node-version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install
        run: npm ci

      - name: The tag is the manifest version
        run: |
          MANIFEST=$(node -p "require('./manifest.json').version")
          if [ "$MANIFEST" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not equal manifest.json version $MANIFEST"
            exit 1
          fi
          test -f "docs/releases/$GITHUB_REF_NAME.md" || { echo "docs/releases/$GITHUB_REF_NAME.md is missing"; exit 1; }

      - name: Gate (typecheck, build, lint, tests, headless Chrome, pty smoke)
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: npm run gate

      - name: Attest main.js, manifest.json and styles.css
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Publish the release
        # gh, not a third-party action. Same three assets, same title (the tag
        # itself) and the same notes file the previous step already proved is
        # present. gh release create fails on an asset path that is not there,
        # which is what fail_on_unmatched_files bought us.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md" \
            main.js \
            manifest.json \
            styles.css
